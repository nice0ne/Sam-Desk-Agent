app:
  name: "Sam-Desk-Agent"
  version: "1.0.0"
  language: "id-ID"

voice:
  hotkey: "<alt>+space"
  panic_key: "esc"
  stt_model: "base"
  stt_device: "cpu"
  stt_compute_type: "int8"
  tts_voice: "id-ID-ArdiNeural"
  tts_rate: "+0%"
  wake_word_enabled: false
  wake_word: "hey sam"

brain:
  provider: "gemini"
  model: "gemini-2.5-flash"
  max_sub_actions: 10

safety:
  failsafe_enabled: true
  panic_esc_press_count: 3
  panic_esc_window_sec: 1.0
