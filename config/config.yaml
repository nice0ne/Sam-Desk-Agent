app:
  name: Sam-Desk-Agent
  version: 1.0.0
  language: id-ID
voice:
  hotkey: <alt>+<space>
  panic_key: esc
  stt_provider: google
  stt_language: id-ID
  stt_model: base
  stt_device: cpu
  stt_compute_type: int8
  tts_voice: id-ID-ArdiNeural
  tts_rate: +0%
  wake_word_enabled: false
  wake_word: hey sam
brain:
  provider: glm
  model: glm-5.3-flash
  base_url: https://open.bigmodel.cn/api/paas/v4/
  api_key: ""
  max_sub_actions: 10
safety:
  failsafe_enabled: true
  panic_esc_press_count: 3
  panic_esc_window_sec: 1.0
